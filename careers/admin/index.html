<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Careers Admin Dashboard | Solis Green Energy Solutions</title>

<!-- FAVICON -->
<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.ico">

<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<style>
/* Admin Specific Styles */
body {
    background-color: #f4f7f6;
}
.admin-header {
    background-color: var(--primary-dark);
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.admin-container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}
.admin-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    padding: 30px;
    margin-bottom: 30px;
}
.auth-container {
    max-width: 400px;
    margin: 100px auto;
}
.dashboard-nav {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}
.dash-tab {
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 600;
    color: #666;
    border-bottom: 3px solid transparent;
}
.dash-tab.active {
    color: var(--primary-blue);
    border-bottom-color: var(--primary-blue);
}
.admin-table {
    width: 100%;
    border-collapse: collapse;
}
.admin-table th, .admin-table td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}
.admin-table th {
    background-color: #f8f9fa;
    font-weight: 600;
    color: #333;
}
.badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
}
.badge.active { background: #d4edda; color: #155724; }
.badge.inactive { background: #f8d7da; color: #721c24; }
.badge.status-applied { background: #e2e3e5; color: #383d41; }
.badge.status-shortlisted { background: #cce5ff; color: #004085; }
.badge.status-interview { background: #fff3cd; color: #856404; }
.badge.status-selected { background: #d4edda; color: #155724; }
.badge.status-rejected { background: #f8d7da; color: #721c24; }

.action-btn {
    background: none;
    border: none;
    cursor: pointer;
    margin-right: 10px;
    color: #666;
    font-size: 1.1rem;
}
.action-btn:hover { color: var(--primary-blue); }
.action-btn.delete:hover { color: #dc3545; }

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    overflow-y: auto;
}
.modal-content {
    background: white;
    max-width: 800px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 10px;
    position: relative;
}
.close-modal {
    position: absolute;
    top: 20px; right: 20px;
    font-size: 1.5rem;
    cursor: pointer;
}
</style>
</head>
<body>

<!-- LOGIN SECTION -->
<div id="login-section" class="auth-container">
    <div class="admin-card text-center">
        <img src="/images/logo/logo.png" alt="Solis Logo" style="max-height: 50px; margin-bottom: 20px;">
        <h2>Admin Login</h2>
        <p>Careers Dashboard</p>
        <form id="loginForm" style="margin-top: 20px; text-align: left;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminEmail" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <p id="loginError" style="color: red; margin-top: 10px; display: none;"></p>
        </form>
    </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboard-section" style="display: none;">
    <div id="header-placeholder"></div>

    <div class="admin-container">
        <div class="dashboard-nav">
            <div class="dash-tab active" data-target="jobs-panel">Jobs Management</div>
            <div class="dash-tab" data-target="applicants-panel">Applicants</div>
        </div>

        <!-- JOBS PANEL -->
        <div id="jobs-panel" class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Job Postings</h3>
                <button class="btn btn-primary" id="openCreateJobModal"><i class="fas fa-plus"></i> Create New Job</button>
            </div>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Department</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobsTableBody">
                        <tr><td colspan="5">Loading jobs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- APPLICANTS PANEL -->
        <div id="applicants-panel" class="admin-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Applicants</h3>
                <div>
                    <input type="text" id="searchApplicant" placeholder="Search name or email..." style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <select id="filterStatus" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-left: 10px;">
                        <option value="">All Statuses</option>
                        <option value="Applied">Applied</option>
                        <option value="Shortlisted">Shortlisted</option>
                        <option value="Interview">Interview</option>
                        <option value="Selected">Selected</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Applicant</th>
                            <th>Job Applied For</th>
                            <th>Experience</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Resume</th>
                        </tr>
                    </thead>
                    <tbody id="applicantsTableBody">
                        <tr><td colspan="6">Loading applicants...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- JOB MODAL -->
<div id="jobModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3 id="jobModalTitle">Create New Job</h3>
        <form id="jobForm" style="margin-top: 20px;">
            <input type="hidden" id="jobId">
            <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" class="form-control" required>
                </div>
                <div style="flex: 1;">
                    <label>Slug (URL path)</label>
                    <input type="text" id="jobSlug" class="form-control" placeholder="e.g. solar-project-engineer" required>
                </div>
            </div>
            <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Department</label>
                    <input type="text" id="jobDepartment" class="form-control" required>
                </div>
                <div style="flex: 1;">
                    <label>Location</label>
                    <input type="text" id="jobLocation" class="form-control" required>
                </div>
            </div>
            <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Employment Type</label>
                    <select id="jobType" class="form-control" required>
                        <option value="Full Time">Full Time</option>
                        <option value="Part Time">Part Time</option>
                        <option value="Contract">Contract</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Experience Needed</label>
                    <input type="text" id="jobExperience" class="form-control" required>
                </div>
            </div>
            <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Qualification</label>
                    <input type="text" id="jobQualification" class="form-control" required>
                </div>
                <div style="flex: 1;">
                    <label>Salary (Optional)</label>
                    <input type="text" id="jobSalary" class="form-control" placeholder="e.g. Based on experience">
                </div>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Job Description</label>
                <textarea id="jobDescription" class="form-control" rows="4" required></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Requirements (HTML List format)</label>
                <textarea id="jobRequirements" class="form-control" rows="4" required><ul><li>Req 1</li></ul></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Responsibilities (HTML List format)</label>
                <textarea id="jobResponsibilities" class="form-control" rows="4" required><ul><li>Resp 1</li></ul></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Benefits (HTML List format)</label>
                <textarea id="jobBenefits" class="form-control" rows="3" required><ul><li>Benefit 1</li></ul></textarea>
            </div>
            <div style="margin-bottom: 20px;">
                <label>
                    <input type="checkbox" id="jobIsActive" checked> Active (Visible on site)
                </label>
            </div>
            <button type="submit" class="btn btn-primary" id="saveJobBtn">Save Job</button>
        </form>
    </div>
</div>

<script type="module" src="./admin.js"></script>
</body>
</html>
