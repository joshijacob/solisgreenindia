<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis EPC - Panel Master (ERP)</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <script src="js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary premium-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../images/logo/logo-white.png" alt="Solis Logo" height="30" class="me-2">
                <span class="fw-bold fs-4">Solis EPC Engine</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="admin.html" class="text-white text-decoration-none"><i class="fa-solid fa-database me-1"></i> General Master</a>
                <span class="text-white-50 mx-2">|</span>
                <span class="text-white-50"><i class="fa-solid fa-boxes-stacked me-1"></i> Panel Master</span>
                <span class="text-white-50 mx-2">|</span>
                <a href="inverter_master.html" class="text-white text-decoration-none"><i class="fa-solid fa-plug me-1"></i> Inverter Master</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="bom_master.html" class="text-white text-decoration-none"><i class="fa-solid fa-sitemap me-1"></i> BOM Master</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Sales</a>
                <a href="#" onclick="logout()" class="btn btn-outline-danger border-0 btn-sm text-white ms-2" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>
    </nav>

    <!-- Odoo Style Header Toolbar -->
    <div class="bg-white border-bottom shadow-sm py-3 mb-4 sticky-top" style="top: 0; z-index: 1000;">
        <div class="container-fluid px-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <h4 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-boxes-stacked me-2"></i> Products / Solar Panels</h4>
                </div>
                <div class="col-md-4 text-center">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-search"></i></span>
                        <input type="text" id="search-bar" class="form-control" placeholder="Search by Code, Brand, or Wattage...">
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-outline-secondary me-2" onclick="document.getElementById('csv-file').click()"><i class="fa-solid fa-upload"></i> Import CSV</button>
                    <input type="file" id="csv-file" accept=".csv" class="d-none">
                    <button class="btn btn-primary fw-bold" id="btn-create"><i class="fa-solid fa-plus me-1"></i> Create Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container-fluid px-4 pb-5">
        
        <!-- List View -->
        <div id="list-view" class="card premium-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product Code</th>
                                <th>Brand</th>
                                <th>Technology</th>
                                <th>Certification</th>
                                <th>Wattage (W)</th>
                                <th>Cost (₹/W)</th>
                                <th>Supplier</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="panel-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Form View (Hidden by default) -->
        <div id="form-view" class="d-none">
            <div class="card premium-card border-top border-primary border-4 shadow">
                <!-- Status Ribbon -->
                <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom">
                    <div>
                        <button class="btn btn-outline-secondary btn-sm me-3" id="btn-cancel"><i class="fa-solid fa-arrow-left"></i> Discard</button>
                        <button class="btn btn-primary btn-sm fw-bold" id="btn-save"><i class="fa-solid fa-save"></i> Save Product</button>
                    </div>
                    <div>
                        <select id="f-status" class="form-select form-select-sm fw-bold d-inline-block w-auto">
                            <option class="text-success">Active</option>
                            <option class="text-danger">Inactive</option>
                        </select>
                    </div>
                </div>
                
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">General Information</h5>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Product Code (SKU)</label>
                                <div class="col-sm-8"><input type="text" class="form-control" id="f-id" placeholder="e.g. PAN-AD-TOP-DCR-605"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Brand</label>
                                <div class="col-sm-8"><input type="text" class="form-control" id="f-brand" placeholder="e.g. Adani"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Technology</label>
                                <div class="col-sm-8"><input type="text" class="form-control" id="f-tech" placeholder="e.g. TOPCon, Mono PERC"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Certification</label>
                                <div class="col-sm-8"><input type="text" class="form-control" id="f-cert" placeholder="e.g. DCR, NDCR, ALMM"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Wattage (Wp)</label>
                                <div class="col-sm-8"><input type="number" class="form-control" id="f-watt" placeholder="e.g. 605"></div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">Purchasing & Engineering</h5>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Price Per Watt (₹)</label>
                                <div class="col-sm-8">
                                    <div class="input-group">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" step="0.01" class="form-control" id="f-price">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">GST (%)</label>
                                <div class="col-sm-8"><input type="number" class="form-control" id="f-gst" value="12"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Supplier</label>
                                <div class="col-sm-8"><input type="text" class="form-control" id="f-supplier" placeholder="Primary Vendor Name"></div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Warranty (Years)</label>
                                <div class="col-sm-8"><input type="number" class="form-control" id="f-warranty" value="12"></div>
                            </div>
                            <div class="row">
                                <label class="col-sm-4 col-form-label fw-bold text-muted small">Weight (kg)</label>
                                <div class="col-sm-8"><input type="number" class="form-control" id="f-weight" placeholder="e.g. 28"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/panel_master.js"></script>
</body>
</html>
