<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis EPC Engine - Login</title>
    <!-- Auth Check First -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <script src="js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --solis-orange: #FF6A2A;
            --solis-orange-hover: #FF824C;
        }
        body {
            background-color: #f4f6f9;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: none;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, var(--solis-orange) 0%, var(--solis-orange-hover) 100%);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .login-header img {
            max-height: 50px;
            margin-bottom: 15px;
            filter: brightness(0) invert(1);
        }
        .login-body {
            padding: 2.5rem;
            background: white;
        }
        .form-control:focus {
            border-color: var(--solis-orange);
            box-shadow: 0 0 0 0.25rem rgba(255, 106, 42, 0.25);
        }
        .btn-login {
            background-color: var(--solis-orange);
            border-color: var(--solis-orange);
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background-color: var(--solis-orange-hover);
            border-color: var(--solis-orange-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-header">
            <img src="https://www.solisgreenindia.in/images/logo/logo.png" alt="Solis Green Energy Solutions">
            <h4 class="fw-bold mb-0">Internal Costing Engine</h4>
            <p class="text-white mt-2 mb-0 small opacity-75">Secure Access Portal</p>
        </div>
        <div class="login-body">
            <div class="alert alert-danger d-none fw-bold small" id="login-error">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>Incorrect email or password.
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Work Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control form-control-lg border-start-0 ps-0" id="emailInput" placeholder="name@solisgreenindia.in" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control form-control-lg border-start-0 ps-0" id="passwordInput" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100 rounded-3 text-white">
                    Access System <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>
            <div class="text-center mt-4">
                <small class="text-muted"><i class="fa-solid fa-shield-halved me-1"></i> Authorized Personnel Only</small>
            </div>
        </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-login');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            btn.disabled = true;

            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            
            try {
                const success = await attemptLogin(email, pass);
                if (!success) {
                    document.getElementById('login-error').classList.remove('d-none');
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch(error) {
                document.getElementById('login-error').innerHTML = '<i class="fa-solid fa-triangle-exclamation me-2"></i>' + error.message;
                document.getElementById('login-error').classList.remove('d-none');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
