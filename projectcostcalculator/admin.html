<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis EPC - Admin Master</title>
    <!-- Auth Check First -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <script src="js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary premium-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../images/logo/logo-white.png" alt="Solis Logo" height="30" class="me-2">
                <span class="fw-bold fs-4">Solis EPC Engine</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50"><i class="fa-solid fa-database me-1"></i> General Master</span>
                <span class="text-white-50 mx-2">|</span>
                <a href="quotes_dashboard.html" class="text-white text-decoration-none"><i class="fa-solid fa-file-invoice-dollar me-1"></i> Quotes</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="panel_master.html" class="text-white text-decoration-none"><i class="fa-solid fa-boxes-stacked me-1"></i> Panel Master</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="inverter_master.html" class="text-white text-decoration-none"><i class="fa-solid fa-plug me-1"></i> Inverter Master</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="bom_master.html" class="text-white text-decoration-none"><i class="fa-solid fa-sitemap me-1"></i> BOM Master</a>
                <span class="text-white-50 mx-2">|</span>
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Sales</a>
                <a href="#" onclick="logout()" class="btn btn-outline-danger border-0 btn-sm text-white ms-2" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4 pb-5">
        <div class="row g-4">
            <!-- Full Width: Price Editors -->
            <div class="col-12">
                <div class="card premium-card">
                    <div class="card-header bg-white border-bottom pt-3 pb-2 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-database me-2"></i> Master Pricing Database</h5>
                        <button class="btn btn-sm btn-success fw-bold" id="btn-save-master"><i class="fa-solid fa-save"></i> Save Changes</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="accordion" id="masterAccordion">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Component Modal -->
    <div class="modal fade" id="addComponentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus-circle me-2"></i>Add New Component</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addComponentForm">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label text-muted small fw-bold">Component Name</label>
                                <input type="text" class="form-control" id="newCompName" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Master</label>
                                <select class="form-select" id="newCompCategory" required>
                                    <option value="supply">Supply Master</option>
                                    <option value="service">Service Master</option>
                                </select>
                            </div>
                            <div class="col-md-12" id="subCategoryContainer">
                                <label class="form-label text-muted small fw-bold">Component Category</label>
                                <select class="form-select" id="newCompSubCategory">
                                    <!-- Injected by JS -->
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Base Price (₹)</label>
                                <input type="number" step="0.01" class="form-control" id="newCompPrice" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">GST %</label>
                                <input type="number" step="0.1" class="form-control" id="newCompGst" value="18" required>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h6 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-sitemap me-2"></i>BOM Quantities (Required)</h6>
                        <p class="small text-muted mb-3">Define how many of this component are needed for each system capacity.</p>
                        
                        <div class="row g-3 mt-1" id="dynamicBOMInputs">
                            <!-- Injected by JS -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary fw-bold" id="btn-save-new-comp"><i class="fa-solid fa-save me-1"></i> Add Component</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/db.js?v=9"></script>
    <script src="js/admin.js?v=9"></script>
</body>
</html>
